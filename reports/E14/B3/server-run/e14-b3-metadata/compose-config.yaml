name: e14-241880179-b3
services:
  buildchecker:
    cap_add:
      - SYS_PTRACE
    cpus: 1
    command:
      - python3
      - labs/e13e14/service.py
    environment:
      E14_ROLE: buildchecker
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /course/*
      PYTHONDONTWRITEBYTECODE: "1"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)
      timeout: 3s
      interval: 5s
      retries: 6
    image: course-e11e12:241880179
    mem_limit: "805306368"
    networks:
      default: null
    pids_limit: 128
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 8080
        published: "18081"
        protocol: tcp
    pull_policy: never
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    user: "0:0"
    volumes:
      - type: bind
        source: /root/devops-students/241880179/e14-b3
        target: /course
        bind:
          create_host_path: true
    working_dir: /course
  draft:
